name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install validation dependency
        run: python -m pip install PyYAML
      - name: Validate Codex skill frontmatter
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import yaml

          skill = Path("packages/codex/skills/make-goal/SKILL.md")
          text = skill.read_text()
          match = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          if not match:
              raise SystemExit("SKILL.md missing YAML frontmatter")
          data = yaml.safe_load(match.group(1))
          if data.get("name") != "make-goal":
              raise SystemExit("SKILL.md name must be make-goal")
          if not data.get("description") or "goal.md" not in data["description"]:
              raise SystemExit("SKILL.md description must mention goal.md")
          print("Skill frontmatter valid")
          PY
      - name: Check unfinished TODO markers
        run: |
          if grep -R -n -E 'TODO|\[TODO' . \
            --exclude-dir=.git \
            --exclude=validate.yml; then
            echo "Unfinished TODO marker found"
            exit 1
          fi
